<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PwXentrix — PW Batches Free</title>
<meta name="theme-color" content="#E0271F">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ 
    --brand: #E0271F; 
    --bg: #F6F2EC; 
    --h-crop: 120px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sora',sans-serif;color:#191412;background:var(--bg);}
  a{text-decoration:none;color:inherit}

  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  #app[hidden]{display:none}
  
  .bar{
    background:#fff; height:56px; display:flex; align-items:center; padding:0 12px; gap:10px;
    border-bottom:1px solid rgba(0,0,0,0.1); flex-shrink:0; z-index: 10;
  }
  .menu-btn{ width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; background: transparent; cursor: pointer; }
  .menu-btn:active { background: #f0f0f0; }
  .menu-btn svg { width: 26px; height: 26px; fill: var(--brand); }

  .brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px; letter-spacing: -0.5px;}
  .brand svg{width:26px;height:26px;fill:var(--brand)}
  .brand em{background:var(--brand);color:#fff;font-size:9px;padding:2px 4px;border-radius:4px; font-style: normal;}

  .acts{margin-left:auto;display:flex;gap:6px}
  .pill{height:32px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;display:flex;align-items:center}
  .pill.s{background:var(--brand);color:#fff}
  .pill.g{background:#fff;border:1px solid rgba(0,0,0,0.15)}

  .shell{position:relative;flex:1;overflow:hidden;background:#fff;}
  .shell iframe{
    position: absolute; left:0; width:100%; border:0;
    top: calc(var(--h-crop) * -1);
    height: calc(100% + var(--h-crop));
  }

  /* === SIDEBAR === */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 98; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #backdrop.open { opacity: 1; pointer-events: auto; }

  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: 280px;
    background: #0F1115; color: #fff; z-index: 99;
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 4px 0 24px rgba(0,0,0,0.2);
  }
  #sidebar.open { transform: translateX(0); }

  .sb-head { padding: 20px; border-bottom: 1px solid #2A2D35; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sb-head span { font-weight: 800; font-size: 20px; }
  .sb-head em { background: var(--brand); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-style: normal; }

  #menuList { flex: 1; overflow-y: auto; padding: 8px 0; }
  .m-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; font-size: 15px; color: #A0A5B1; cursor: pointer;
    border-left: 4px solid transparent; transition: background 0.15s, color 0.15s;
    position: relative; user-select: none;
  }
  .m-item:active { background: #1A1D24; }
  .m-item.active { color: #fff; background: #1A1D24; border-left-color: var(--brand); }
  .m-item svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
  
  .m-item.cooling::after {
    content: ''; position: absolute; inset: 0; background: rgba(224,39,31,0.15); border-radius: 0;
    animation: coolPress 0.6s ease-out forwards;
  }
  @keyframes coolPress { from { opacity: 1; } to { opacity: 0; } }

  /* === LOGIN === */
  #gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px}
  .gate-in{text-align:center;max-width:400px;width:100%; animation: fadeIn 0.4s;}
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  h1{font-size:32px;margin:10px 0 5px;font-weight:800}
  .sub{font-size:14px;color:#555;margin-bottom:25px;line-height:1.5}
  .key-box{display:flex; gap:10px; background:#fff; padding:8px; border-radius:12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border:1.5px solid rgba(0,0,0,0.1)}
  .key-box input{flex:1; border:none; padding:8px 12px; font-size:15px; outline:0; background:#F6F2EC; border-radius:8px; font-family:inherit}
  .key-box button{background:var(--brand); color:#fff; border:0; padding:0 20px; border-radius:8px; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer}
  
  .load-wrap{position:absolute;inset:0;z-index:15;background:#fff;display:flex;align-items:center;justify-content:center; transition: opacity 0.3s;}
  .spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide-elem{opacity:0;pointer-events:none}
  
  #toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:#191412;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:0.3s;z-index:300}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="gate">
  <div class="gate-in">
    <svg style="width:60px;margin:0 auto 15px;fill:var(--brand);display:block" viewBox="0 0 64 64"><path d="M32 6 54.5 19v26L32 58 9.5 45V19Z"/><path d="M24 24l16 16M40 24 24 40" stroke="#fff" stroke-width="7"/></svg>
    <h1>PwXentrix</h1>
    <p class="sub">Login key dalo <br> aur batches unlock karo.</p>
    <form onsubmit="unlock(event)">
      <div class="key-box">
        <input type="text" id="inp" placeholder="Access Key" required>
        <button type="submit">GO</button>
      </div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header class="bar">
    <button class="menu-btn" onclick="toggleMenu(true)">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 64 64"><path d="M32 6 54.5 19v26L32 58 9.5 45V19Z"/><path d="M24 24l16 16M40 24 24 40" stroke="#fff" stroke-width="7"/></svg>
      <span>PwXentrix <em>FREE</em></span>
    </div>
    <div class="acts">
      <a href="https://t.me/pwxentrix" target="_blank" class="pill s">Channel</a>
      <a href="https://t.me/naughtyximax" target="_blank" class="pill g">Contact</a>
    </div>
  </header>

  <main class="shell">
    <div class="load-wrap" id="loader"><div class="spinner"></div></div>
    <iframe id="ifr" onload="document.getElementById('loader').classList.add('hide-elem')"></iframe>
  </main>
</div>

<div id="backdrop" onclick="toggleMenu(false)"></div>
<div id="sidebar">
  <div class="sb-head">
    <span>PwXentrix</span> <em>MENU</em>
  </div>
  <nav id="menuList"></nav>
</div>

<div id="toast"></div>

<script>
/* ================== CONFIG ================== */
const KEYS = ["PWXENTRIX", "HELLO", "STUDY2025"];
const STORE_KEY = 'px_key';
const URL_STORE = 'px_custom_urls';
const DEFAULT_URL = "https://www.learnxpw.site/study/batches";

const MENU = [
  { id:'study',         label:'Study',         url:'https://www.learnxpw.site/study',             icon:'<path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.5 13.5v4l6.5 3.5 6.5-3.5v-4L12 17.5l-6.5-4z"/>' },
  { id:'pi',            label:'PI',            url:'https://www.learnxpw.site/study/pi',          icon:'<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v-2h-2v2zm0-4h2V7h-2v6z"/>' },
  { id:'batches',       label:'Batches',       url:'https://www.learnxpw.site/study/batches',     icon:'<path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/>' },
  { id:'next-toppers',  label:'Next Toppers',  url:'https://www.learnxpw.site/study/nexttoppers', icon:'<path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4-6.2-4.6L5.8 21.3l2.4-7.4L2 9.4h7.6z"/>' },
  { id:'missionjeet',   label:'MissionJeet',   url:'https://www.learnxpw.site/study/missionjeet', icon:'<path d="M12 2L2 22h20L12 2zm0 3.8L18.5 20h-13L12 5.8z"/>' },
  { id:'vibrant',       label:'Vibrant',       url:'https://www.learnxpw.site/study/vibrant',     icon:'<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>' },
  { id:'my-batches',    label:'My Batches',    url:'https://www.learnxpw.site/study/mybatches',   icon:'<path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>' },
  { id:'history',       label:'History',       url:'https://www.learnxpw.site/history',           icon:'<path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>' }
];

let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(URL_STORE) || '{}'); } catch(e) {}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

if(localStorage.getItem(STORE_KEY)) initApp(false);

function unlock(e){
  e.preventDefault();
  const k = document.getElementById("inp").value.toUpperCase().trim();
  if(KEYS.includes(k)){
    localStorage.setItem(STORE_KEY, k);
    initApp(true);
  } else {
    alert("Galat Key! Try: PWXENTRIX");
  }
}

function initApp(isFresh){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").hidden = false;
  if(isFresh) toast("Welcome to PwXentrix!");
  renderMenu();
  loadUrl(DEFAULT_URL, document.querySelector('.m-item[data-id="batches"]'));
}

function toggleMenu(open) {
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('backdrop').classList.toggle('open', open);
}

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  MENU.forEach(item => {
    const url = overrides[item.id] || item.url;
    const el = document.createElement('div');
    el.className = 'm-item';
    el.dataset.id = item.id;
    el.dataset.url = url;
    el.innerHTML = `<svg viewBox="0 0 24 24">${item.icon}</svg><span>${item.label}</span>`;
    el.addEventListener('click', () => loadUrl(url, el));

    // Optional hidden long-press to edit URL (silent)
    let lpTimer = null;
    let editTriggered = false;
    el.addEventListener('pointerdown', () => {
      editTriggered = false;
      lpTimer = setTimeout(() => {
        editTriggered = true;
        const newUrl = prompt(`"${item.label}" ka URL:`, url);
        if(newUrl && newUrl.trim() && newUrl.trim() !== url){
          overrides[item.id] = newUrl.trim();
          localStorage.setItem(URL_STORE, JSON.stringify(overrides));
          renderMenu();
          toast('✅ URL save ho gaya');
        }
      }, 1500);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => {
      el.addEventListener(ev, () => clearTimeout(lpTimer));
    });
    el.addEventListener('click', (e) => { if(editTriggered) e.stopImmediatePropagation(); }, true);

    list.appendChild(el);
  });
}

function loadUrl(url, el){
  document.querySelectorAll('.m-item').forEach(i => i.classList.remove('active'));
  if(el) el.classList.add('active');
  toggleMenu(false);
  document.getElementById('loader').classList.remove('hide-elem');
  document.getElementById('ifr').src = url;
}
</script>
</body>
</html>
